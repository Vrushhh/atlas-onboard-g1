name: Product and golden checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build
      - run: python3 verify_dataset.py
        working-directory: golden
      - run: python3 evaluate.py --self-test --output reports/evaluator-self-test.json
        working-directory: golden
      - run: ATLAS_CORE_PATH=../dist/core.js node run_mvp.cjs
        working-directory: golden
      - run: python3 evaluate.py --target mvp_core --predictions reports/mvp-predictions.jsonl --output reports/mvp-regression.json
        working-directory: golden
